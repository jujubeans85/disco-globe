name: Disco Juice checks
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'netlify.toml'
      - 'README.md'
      - '*.js'
      - 'styles.css'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/mobile-smoke.mjs
