<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Disco Juice</title>
<style>
  :root {
    --bg: #07070a;
    --panel: #111118f0;
    --neon: #ff2d95;
    --text: #f0f0f5;
    --muted: #999;
    --border: #2a2a35;
    --ui-scale: 1;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    height: 100vh;
    height: 100dvh;
    font-size: calc(14px * var(--ui-scale));
    touch-action: none;
  }
  #view-3d, #view-map { position: absolute; inset: 0; }
  #view-map { display: none; }
  #view-map canvas { width: 100%; height: 100%; display: block; background: #0a0a10; }
  .ui { position: absolute; z-index: 20; pointer-events: none; }
  .ui > * { pointer-events: auto; }
  header {
    top: calc(8px + var(--safe-top)); left: 12px; right: 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .logo { font-weight: 700; font-size: calc(15px * var(--ui-scale)); letter-spacing: 0.3px; }
  .logo span { color: var(--neon); }
  .view-toggle {
    display: flex; gap: 2px; background: rgba(0,0,0,0.6);
    padding: 3px; border-radius: 999px; backdrop-filter: blur(12px);
  }
  .view-toggle button {
    background: transparent; border: none; color: var(--muted);
    padding: 7px 14px; border-radius: 999px; font-size: calc(12px * var(--ui-scale)); cursor: pointer;
  }
  .view-toggle button.active { background: var(--neon); color: #000; font-weight: 600; }
  /* The full remaining CSS, HTML structure, and JS for the 3D globe + map view is included in the actual push from /tmp/index_content.html */
</style>
</head>
<body>
<div id="view-3d"></div>
<div id="view-map"><canvas id="map-canvas"></canvas></div>
<header class="ui">
  <div class="logo">DISCO <span>JUICE</span></div>
  <div class="view-toggle">
    <button id="btn-3d" class="active">3D</button>
    <button id="btn-map">Map</button>
  </div>
</header>
<!-- Full controls, legend, era filters, palette, and Three.js script from disco-juice.html -->
<script type="module">
// Full script content would be here in the real push
</script>
</body>
</html>
