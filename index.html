<title>Disco Juice — Decade Globes</title>
<style>
  :root {
    --bg: #07070a;
    --panel: #111118ee;
    --neon: #ff2d95;
    --text: #f0f0f5;
    --muted: #888;
    --border: #2a2a35;
    --ui-scale: 1;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    height: 100vh; height: 100dvh;
    font-size: calc(14px * var(--ui-scale));
    touch-action: none;
  }
  #canvas-container { position: absolute; inset: 0; }
  .ui { position: absolute; z-index: 20; pointer-events: none; }
  .ui > * { pointer-events: auto; }
  header {
    top: calc(8px + var(--safe-top)); left: 12px; right: 12px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .logo { font-weight: 700; font-size: calc(15px * var(--ui-scale)); white-space: nowrap; }
  .logo span { color: var(--neon); }
  .decade-select {
    background: rgba(0,0,0,0.6); border: 1px solid #333; color: #eee;
    padding: 6px 10px; border-radius: 999px; font-size: calc(12px * var(--ui-scale));
    backdrop-filter: blur(12px); max-width: 140px;
  }
  .tweaks {
    position: absolute; left: 12px; bottom: calc(12px + var(--safe-bottom));
    width: min(280px, calc(100vw - 24px));
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px; backdrop-filter: blur(16px);
    font-size: calc(13px * var(--ui-scale));
    max-height: 40vh; overflow-y: auto;
  }
  .tweaks h3 {
    font-size: calc(11px * var(--ui-scale)); letter-spacing: 0.8px; color: var(--muted);
    margin-bottom: 8px; text-transform: uppercase;
  }
  .tweak-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px; gap: 8px;
  }
  .tweak-row label { color: #ccc; flex: 1; }
  .tweak-row button.toggle {
    background: #222; border: 1px solid #333; color: #aaa; border-radius: 8px;
    padding: 6px 12px; font-size: calc(12px * var(--ui-scale)); cursor: pointer; min-width: 48px;
  }
  .tweak-row button.toggle.on { background: var(--neon); color: #000; border-color: var(--neon); }
  .count { position: absolute; top: calc(52px + var(--safe-top)); left: 12px; font-size: calc(11px * var(--ui-scale)); color: var(--muted); }
  .hint {
    position: absolute; bottom: calc(8px + var(--safe-bottom)); left: 50%; transform: translateX(-50%);
    font-size: calc(10px * var(--ui-scale)); color: var(--muted);
    background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 8px;
    max-width: 85vw; text-align: center; pointer-events: none;
  }
  #player-modal {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
    align-items: center; justify-content: center; padding: 16px;
  }
  #player-modal.open { display: flex; }
  .player-card {
    background: #111118; border: 1px solid #2a2a35; border-radius: 16px;
    width: min(420px, 100%); padding: 16px; position: relative;
  }
  .player-card h2 { font-size: 16px; margin-bottom: 4px; }
  .player-card .meta { color: #888; font-size: 12px; margin-bottom: 12px; }
  .player-card iframe { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 8px; background: #000; }
  .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .links a {
    background: #222; color: #eee; text-decoration: none; padding: 6px 10px;
    border-radius: 8px; font-size: 12px; border: 1px solid #333;
  }
  .links a:hover { background: var(--neon); color: #000; }
  .close-btn {
    position: absolute; top: 8px; right: 8px; background: none; border: none;
    color: #888; font-size: 20px; cursor: pointer; width: 32px; height: 32px;
  }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div class="ui">
  <header>
    <div class="logo">DISCO <span>JUICE</span></div>
    <select id="decade-select" class="decade-select"></select>
  </header>
  <div class="count" id="count">0 markers</div>
  <div class="tweaks">
    <h3>Controls</h3>
    <div class="tweak-row">
      <label>Auto-rotate</label>
      <button id="auto-toggle" class="toggle on">ON</button>
    </div>
    <div class="tweak-row">
      <label>Geo outline</label>
      <button id="geo-toggle" class="toggle on">ON</button>
    </div>
  </div>
  <div class="hint">Drag to rotate · Pinch to zoom · Tap markers to play</div>

<div id="player-modal">
  <div class="player-card">
    <button class="close-btn" id="close-player">×</button>
    <h2 id="player-title">Track</h2>
    <div class="meta" id="player-meta"></div>
    <iframe id="player-iframe" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    <div class="links" id="player-links"></div>
  </div>
</div>

const container = document.getElementById("canvas-container");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07070a);
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 3.4);

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.6;
controls.maxDistance = 6;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;

scene.add(ambient);
const key = new THREE.DirectionalLight(0xffffff, 0.85);
key.position.set(4, 3, 5);
scene.add(key);
const neonLight = new THREE.PointLight(0xff2d95, 1.8, 8);

function latLonToVec3(lat, lon, radius = 1.01) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -radius * Math.sin(phi) * Math.cos(theta),
    radius * Math.cos(phi),
    radius * Math.sin(phi) * Math.sin(theta)
  );
}
function clearMarkers() {
  markers.forEach(m => scene.remove(m));
  markers = [];
}
function buildGlobe(decadeId) {
  if (globe) scene.remove(globe);
  if (geoLines) scene.remove(geoLines);
  const style = DECADES.find(d => d.id === decadeId) || DECADES[DECADES.length - 1];
  const mat = new THREE.MeshPhysicalMaterial({
    color: style.color,
    metalness: style.metal,
    roughness: style.rough,
    clearcoat: 0.35,
    emissive: style.emissive,
    emissiveIntensity: 0.25
  });
  globe = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 64), mat);
  scene.add(globe);
  neonLight.color.setHex(style.light);
  key.color.setHex(style.light);
  buildMarkers(decadeId);

function buildMarkers(decadeId) {
  clearMarkers();
  const tracks = TRACKS[decadeId] || [];
  const size = window.innerWidth < 500 ? 0.018 : 0.014;
  tracks.forEach((t, i) => {
    const lat = (Math.sin(i * 1.7) * 60) + (Math.random() * 20 - 10);
    const lon = (i * 37) % 360 - 180;
    const pos = latLonToVec3(lat, lon, 1.02);
    const geo = new THREE.SphereGeometry(size, 8, 8);
    const mat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const marker = new THREE.Mesh(geo, mat);
    marker.position.copy(pos);
    marker.userData = { ...t, decade: decadeId, lat, lon };
    scene.add(marker);
    markers.push(marker);
  });

async function loadAndDrawGeo() {
  if (geoLines) scene.remove(geoLines);
  try {
    const res = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
    const topology = await res.json();
    const group = new THREE.Group();
    const material = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.22 });
    const transform = topology.transform || { scale: [1, 1], translate: [0, 0] };
    const scale = transform.scale;
    const translate = transform.translate;
    function decodeArc(arc) {
      let x = 0, y = 0;
      const points = [];
      for (const [dx, dy] of arc) {
        x += dx;
        y += dy;
        const lon = x * scale[0] + translate[0];
        const lat = y * scale[1] + translate[1];
        points.push(latLonToVec3(lat, lon, 1.006));
      }
      return points;
    }
    (topology.arcs || []).slice(0, 280).forEach(arc => {
      const pts = decodeArc(arc);
      if (pts.length > 2) {
        const geom = new THREE.BufferGeometry().setFromPoints(pts);
        group.add(new THREE.Line(geom, material));
      }
    });
    geoLines = group;
    scene.add(geoLines);
  } catch (e) {
    console.warn("Geo outline load failed", e);
  }
}
const select = document.getElementById("decade-select");

  opt.value = d.id;
  opt.textContent = d.label;
  if (d.id === "2020s") opt.selected = true;
  select.appendChild(opt);
});
select.onchange = () => {
  currentDecade = select.value;

  e.target.classList.toggle("on", controls.autoRotate);
};
document.getElementById("geo-toggle").onclick = (e) => {
  showGeo = !showGeo;
  e.target.textContent = showGeo ? "ON" : "OFF";
  e.target.classList.toggle("on", showGeo);
  if (showGeo) loadAndDrawGeo();
  else if (geoLines) scene.remove(geoLines);

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
renderer.domElement.addEventListener("pointerdown", (event) => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(markers);
  if (hits.length) openPlayer(hits[0].object.userData);

function openPlayer(data) {
  const modal = document.getElementById("player-modal");
  document.getElementById("player-title").textContent = data.title;
  document.getElementById("player-meta").textContent = `${data.artist} · ${data.year} · ${data.decade}`;
  const iframe = document.getElementById("player-iframe");
  iframe.src = `https://www.youtube.com/embed/${data.youtubeId}?autoplay=1&rel=0`;
  const links = document.getElementById("player-links");
  links.innerHTML = `
    <a href="https://www.youtube.com/watch?v=${data.youtubeId}" target="_blank">YouTube</a>
    <a href="https://open.spotify.com/search/${encodeURIComponent(data.artist + " " + data.title)}" target="_blank">Spotify</a>
    <a href="https://soundcloud.com/search?q=${encodeURIComponent(data.artist + " " + data.title)}" target="_blank">SoundCloud</a>
    <a href="https://www.discogs.com/search/?q=${encodeURIComponent(data.artist + " " + data.title)}" target="_blank">Discogs</a>
  `;
  modal.classList.add("open");
}
document.getElementById("close-player").onclick = () => {
  document.getElementById("player-modal").classList.remove("open");
  document.getElementById("player-iframe").src = "";
};
buildGlobe("2020s");
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  buildMarkers(currentDecade);
});
</script>
