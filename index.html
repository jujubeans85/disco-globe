<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120e19">
<link rel="canonical" href="https://jujubeans85.github.io/disco-globe/">
<meta property="og:url" content="https://jujubeans85.github.io/disco-globe/">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<link rel="stylesheet" href="./hub.css">
<title>Disco Juice — Discover & Listen</title>
</head>
<body>
<header>
  <a class="brand" href="./">DISCO <em>JUICE</em></a>
  <nav aria-label="Main navigation">
    <button id="browse" aria-pressed="true">Discover</button>
    <button id="shortlist" aria-pressed="false">Shortlist <span id="saved-count">0</span></button>
    <a href="./globe.html">Globe ↗</a>
  </nav>
</header>
<main>
  <section class="intro">
    <p class="eyebrow">THE LISTENING ATLAS / 1950s–2020s</p>
    <h1 id="heading" tabindex="-1">Find your next track.</h1>
    <p id="description">Explore eight decades of music by sound, mood and scene.</p>
  </section>
  <section id="facets" aria-label="Discovery filters">
    <label class="wide">Artist, track or scene<input id="query" type="search" placeholder="Search the catalogue"></label>
    <div class="filters">
      <label>Decade<select id="decade"></select></label>
      <label>Genre<select id="genre"></select></label>
      <label>Mood<select id="mood"></select></label>
      <label>Country / area<select id="country"></select></label>
      <label>City / scene<select id="city"></select></label>
      <label>Listening source<select id="listening"></select></label>
    </div>
    <div class="toolbar"><button id="expand">Find more online</button><button id="reset">Reset filters</button></div>
    <p id="discovery" role="status"></p>
    <p class="note">Places describe associated music scenes. Missing metadata stays unknown.</p>
  </section>
  <p id="notice" role="status"></p>
  <div class="results-head"><h2 id="results-title">Recordings</h2><span id="count" aria-live="polite"></span></div>
  <ul id="results"></ul>
  <button id="more" hidden>Show more</button>
  <footer><a href="https://jujubeans85.github.io/disco-globe/">Canonical Disco Juice address</a></footer>
</main>
<script type="module" src="./hub.js"></script>
</body>
</html>
